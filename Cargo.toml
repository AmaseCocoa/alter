[package]
name = "alter"
version = "0.3.0"
edition = "2024"
authors = ["AmaseCocoa <cocoa@amase.cc>"]
description = 'One-liner to switch Git identity and credentials.'
license = "MIT"
repository = "https://github.com/AmaseCocoa/alter"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
clap = { version = "4.5.53", features = ["derive"] }
dialoguer = "0.12.0"
dirs = "6.0.0"
gix-config = { version = "0.48.0", features = ["serde"] }
gix-object = "0.52.0"
serde = { version = "1", features = ["derive"] }
toml = "0.9.8"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2.5.4"
tiny_http = "0.12.0"
urlencoding = "2.1.3"
base64 = "0.22.1"
sha2 = "0.10.9"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "blocking", "json", "form"] }
rand = { version = "0.10", default-features = false, features = ["alloc", "thread_rng"] }
serde_json = "1"
keyring = "2.1"
open = "5.0"
